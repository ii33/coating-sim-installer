name: Windows installer checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m pytest -q
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      - run: python -m PyInstaller --noconfirm --clean installer.spec
      - name: Native executable self-check
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'installer-self-check.json'
          $exe = (Resolve-Path 'dist/CoatingSimInstaller-v0.1.0-alpha.1-windows-x64.exe').Path
          $p = Start-Process $exe -ArgumentList @('--self-check','--self-check-output', $report) -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw 'Executable self-check failed' }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if ($result.status -ne 'success' -or !$result.frozen) { throw 'Invalid self-check result' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-onefile
          path: dist/*.exe
